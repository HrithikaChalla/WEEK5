<!DOCTYPE html>
<html>
<head>
    <title> Greeting </title>
</head>
<body>

<h1>Welcome!</h1>


<script>
    var time = new Date().getHours();
    var greeting = "";

    if (time < 12) {
        greeting = "Good Morning";
    } else if (time < 18) {
        greeting = "Good Afternoon";
    } else {
        greeting = "Good Evening";
    }

    document.getElementById("text").innerHTML = greeting;
</script>

</body>
</html>
