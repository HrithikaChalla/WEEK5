<!DOCTYPE html>
<html>
<head>
    <title>Greeting</title>
</head>
<body>

<h2 id="text"></h2>

<script>
    var time = new Date().getHours();
    var greeting;

    if (time < 12) {
        greeting = "Good Morning";
    } 
    else if (time < 17) {
        greeting = "Good Afternoon";
    } 
    else {
        greeting = "Good Evening";
    }

    document.getElementById("text").innerText = greeting;
</script>

</body>
</html>
