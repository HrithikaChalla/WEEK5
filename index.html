<!DOCTYPE html>
<html>
<head>
    <title> Greeting </title>
</head>
<body>

<h1>Welcome!</h1>
<h2 id="msg"></h2>

<script>
    var time = new Date().getHours();
    var greeting = "";

    if (time < 12) {
        greeting = "Good Morning";
    } else if (time < 18) {
        greeting = "Good Afternoon";
    } else {
        greeting = "Good Evening";
    }

    document.getElementById("msg").innerHTML = greeting;
</script>

</body>
</html>
